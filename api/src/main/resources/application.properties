spring.application.name=maoamiga-api
server.port=8080

# H2 gravando em arquivo (os dados continuam depois de reiniciar a API)
spring.datasource.url=jdbc:h2:file:./data/maoamiga;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Respostas paginadas no formato { "content": [...], "page": {...} }
spring.data.web.pageable.serialization-mode=via_dto
